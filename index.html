<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSister — Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">UniSister 🌸</div>
    <div class="header-right">
        <button id="themeToggle" class="theme-btn">🌙 Темная</button>
        <select id="langSelect" class="lang-select">
            <option value="ru">РУС</option>
            <option value="kz">ҚАЗ</option>
            <option value="en">ENG</option>
        </select>
    </div>
</header>

<main class="container">
    <div class="card auth-card">
        <h2 id="formTitle">Регистрация профиля студентки</h2>

        <form id="regForm">
            <div class="form-group">
                <label id="labelName">ФИО и Университет</label>
                <input type="text" id="nameUni" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label id="labelEmail">Студенческая почта</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label id="labelBudget">Бюджет (₸)</label>
                    <input type="number" id="budget" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label id="labelZodiac">Знак зодиака ✨</label>
                    <select id="zodiac">
                        <option value="Овен">♈ Овен</option>
                        <option value="Телец">♉ Телец</option>
                        <option value="Близнецы">♊ Близнецы</option>
                        <option value="Рак">♋ Рак</option>
                        <option value="Лев">♌ Лев</option>
                        <option value="Дева">♍ Дева</option>
                        <option value="Весы">♎ Весы</option>
                        <option value="Скорпион">♏ Скорпион</option>
                        <option value="Стрелец">♐ Стрелец</option>
                        <option value="Козерог">♑ Козерог</option>
                        <option value="Водолей">♒ Водолей</option>
                        <option value="Рыбы">♓ Рыбы</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="labelSchedule">Режим дня</label>
                    <select id="schedule">
                        <option value="жаворонок" id="optLark">Жаворонок</option>
                        <option value="сова" id="optOwl">Сова</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="privacy-box" id="privacyBox">
                    🔒 <strong>Конфиденциально:</strong> Ваши документы используются только для проверки статуса студентки. Они не публикуются в открытом доступе.
                </div>
                <label id="labelPassport">Ссылка на документ / Паспорт</label>
                <input type="url" id="passportLink" required>
            </div>

            <div class="form-group">
                <label id="labelWhy">Зачем вам совместное проживание?</label>
                <input type="text" id="whyStay" required>
            </div>

            <button type="submit" id="btnSubmit">Создать аккаунт и войти</button>
        </form>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
